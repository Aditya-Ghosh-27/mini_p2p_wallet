version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: mini_upi_db
    restart: always
    environment:
      POSTGRES_USER: upi_admin
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: mini_upi
    ports:
      - '5432:5432'
    volumes:
      - postgres_date:/var/lib/postgresql/data

volumes:
  postgres_data: